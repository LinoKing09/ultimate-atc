name: Deploy to GitHub Pages

# Requires: repository Settings -> Pages -> Source: "GitHub Actions"
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The small speech model of the own speech recogniser (Vosk, Apache 2.0, about 40 MB) is served with the site, not
      # committed. The optional large model (128 MB) is not: with it the site was about 170 MB and GitHub Pages took
      # longer than the 10 minutes of deploy-pages to sync the files, so deployments were cancelled.
      - run: npm run voice-model
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
